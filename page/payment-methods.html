<section>
    <h2>Selecione a forma de pagamento</h2>
    <div class="payment-methods">
        <label class="payment-method">
            <input type="radio" name="metodo" value="pix" checked>
            <span class="method-icon"><img src="../assets/loja/pix.svg" alt=""></span>
            <strong>PIX</strong>
            <span class="selection-mark">
                <img class="radio-empty" src="../assets/loja/opcaoinativa.svg" alt="">
                <img class="radio-check" src="../assets/loja/check.svg" alt="">
            </span>
        </label>
        <label class="payment-method">
            <input type="radio" name="metodo" value="card">
            <span class="method-icon"><img src="../assets/loja/card.svg" alt=""></span>
            <strong>Cartão de Crédito</strong>
            <span class="selection-mark">
                <img class="radio-empty" src="../assets/loja/opcaoinativa.svg" alt="">
                <img class="radio-check" src="../assets/loja/check.svg" alt="">
            </span>
        </label>
        <label class="payment-method">
            <input type="radio" name="metodo" value="debit">
            <span class="method-icon"><img src="../assets/loja/debit.svg" alt=""></span>
            <strong>Cartão de Débito</strong>
            <span class="selection-mark">
                <img class="radio-empty" src="../assets/loja/opcaoinativa.svg" alt="">
                <img class="radio-check" src="../assets/loja/check.svg" alt="">
            </span>
        </label>
        <label class="payment-method">
            <input type="radio" name="metodo" value="cash">
            <span class="method-icon"><img src="../assets/loja/cash.svg" alt=""></span>
            <strong>Dinheiro</strong>
            <span class="selection-mark">
                <img class="radio-empty" src="../assets/loja/opcaoinativa.svg" alt="">
                <img class="radio-check" src="../assets/loja/check.svg" alt="">
            </span>
        </label>
    </div>
    <p class="notice">A forma escolhida será registrada com o pedido. Nenhum valor será cobrado.</p>
</section>
